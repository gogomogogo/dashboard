# SEIBro 국내 투자자 순매수 상위를 매일 받아 snapshots/net_buy.json으로 커밋한다.
name: SEIBro 순매수 저장

on:
  schedule:
    - cron: "30 23 * * 0-4"   # 한국 시간 월~금 08:30 (전날 결제분 반영 후)
    - cron: "0 9 * * 1-5"     # 한국 시간 월~금 18:00 (한 번 더 갱신)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_net_buy.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add snapshots/net_buy.json
          git diff --cached --quiet || git commit -m "SEIBro 순매수 데이터 갱신"
          git push
