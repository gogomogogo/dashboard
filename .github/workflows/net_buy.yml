# SEIBro 국내 투자자 순매수 상위를 매일 받아 snapshots/net_buy.json으로 커밋한다.
name: SEIBro 순매수 저장

on:
  schedule:
    - cron: "30 23 * * 0-4"   # 한국 시간 월~금 08:30 (전날 결제분 반영 후)
    - cron: "0 9 * * 1-5"     # 한국 시간 월~금 18:00 (한 번 더 갱신)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

# 실행이 겹치면 앞의 것이 끝날 때까지 기다린다 (동시에 저장하다 충돌하는 것 방지)
concurrency:
  group: net-buy
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_net_buy.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add snapshots/net_buy.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "SEIBro 순매수 데이터 갱신"
          # 그사이 저장소가 바뀌었으면(파일 업로드 등) 최신 상태 위에 다시 얹어서 올린다
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "올리기 실패, ${i}번째 재시도"
            sleep $((i * 5))
          done
          exit 1
